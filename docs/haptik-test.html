<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haptik-Test</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px 16px 60px; background: #0B1020; color: #E8ECF5; font: 16px/1.4 -apple-system, system-ui, sans-serif; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p.lead { color: #9AA3B8; margin: 0 0 22px; }
  .t { position: relative; display: block; width: 100%; box-sizing: border-box; margin: 0 0 14px; padding: 18px 16px; border: 1px solid #2A3350; border-radius: 16px; background: #141B30; color: #E8ECF5; font: 600 18px/1.3 inherit; text-align: left; -webkit-tap-highlight-color: transparent; }
  .t small { display: block; font-weight: 400; font-size: 13px; color: #9AA3B8; margin-top: 4px; }
  .t:active { background: #1D2744; }
  .hid { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; left: -9999px; }
  /* Methode C: echter Schalter liegt unsichtbar über dem ganzen Knopf */
  .ov { position: absolute; inset: 0; border-radius: 16px; cursor: pointer; }
  .ov input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0.011; cursor: pointer; }
  .cnt { float: right; color: #6C7FE8; font-weight: 700; }
  .sw { display: flex; align-items: center; gap: 12px; }
  .info { margin-top: 26px; font-size: 13px; color: #9AA3B8; word-break: break-all; }
</style>
</head>
<body>
<h1>Haptik-Test</h1>
<p class="lead">Tippe jeden Knopf ein paar Mal an und merke dir, bei welchem Buchstaben du etwas spürst.</p>

<button class="t" id="a">A <span class="cnt" id="ca">0</span><small>Vibrieren wie bisher (Android-Weg)</small></button>

<button class="t" id="b">B <span class="cnt" id="cb">0</span><small>Unsichtbarer Schalter, per Programm umgelegt</small></button>

<div class="t" id="c">C <span class="cnt" id="cc">0</span><small>Unsichtbarer Schalter direkt unter dem Finger</small>
  <label class="ov"><input type="checkbox" switch id="csw"></label>
</div>

<div class="t sw">D <span class="cnt" id="cd">0</span>
  <input type="checkbox" switch id="dsw" style="transform:scale(1.4)">
  <small style="margin:0">Echter, sichtbarer Schalter: tippe direkt auf den Schalter</small>
</div>

<button class="t" id="e">E <span class="cnt" id="ce">0</span><small>Echter Knopf mit Schalter darin (so käme es in die App)</small></button>

<button class="t" id="f">F <span class="cnt" id="cf">0</span><small>Wie E, aber die App hört zentral mit (wie React)</small></button>

<label class="hid" id="blabel"><input type="checkbox" switch id="bsw"></label>

<div class="info" id="info"></div>

<script>
  const inc = id => { const e = document.getElementById(id); e.textContent = +e.textContent + 1; };
  document.getElementById("a").addEventListener("click", () => { inc("ca"); try { navigator.vibrate && navigator.vibrate(15); } catch (e) {} });
  document.getElementById("b").addEventListener("click", () => { inc("cb"); document.getElementById("blabel").click(); });
  document.getElementById("csw").addEventListener("change", () => inc("cc"));
  document.getElementById("dsw").addEventListener("change", () => inc("cd"));
  const addSw = el => { const i = document.createElement("input"); i.type = "checkbox"; i.setAttribute("switch", ""); i.tabIndex = -1; i.setAttribute("aria-hidden", "true"); i.style.cssText = "position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0.011;border-radius:inherit;cursor:pointer"; el.appendChild(i); };
  const e = document.getElementById("e"), f = document.getElementById("f");
  addSw(e); addSw(f);
  e.addEventListener("click", () => inc("ce"));
  document.addEventListener("click", ev => { if (ev.target.closest && ev.target.closest("#f")) inc("cf"); });
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  document.getElementById("info").textContent = "Modus: " + (standalone ? "Home-Bildschirm-App" : "Browser") + " · " + navigator.userAgent;
</script>
</body>
</html>
