  background-image:
    linear-gradient(rgba(120,120,140,0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120,120,140,0.07) 1px, transparent 1px);
  background-size: 18px 18px;
}
@keyframes confetti-fall {
  0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(var(--spin)); opacity: 0.9; }
}
@keyframes firework-fly {
  0% { transform: translate(0, 0) scale(1); opacity: 1; }
  70% { opacity: 1; }
  100% { transform: translate(var(--tx), var(--ty)) scale(0.3); opacity: 0; }
}
@keyframes firework-flash {
  0% { transform: scale(0); opacity: 0.9; }
  40% { transform: scale(1); opacity: 0.5; }
  100% { transform: scale(1.4); opacity: 0; }
}
@keyframes chalk-draw {
  from { stroke-dashoffset: var(--len); opacity: 0; }
  to { stroke-dashoffset: 0; opacity: 0.92; }
}
@keyframes value-pop {
  0% { transform: scale(1); }
  35% { transform: scale(1.22); }
  100% { transform: scale(1); }
}
.value-pop { animation: value-pop 0.38s cubic-bezier(0.34, 1.56, 0.64, 1); display: inline-block; }
@keyframes tile-glow {
  0%, 100% { box-shadow: 0 8px 24px -10px var(--glow), 0 0 0 0 var(--glow); }
  50% { box-shadow: 0 10px 30px -8px var(--glow), 0 0 22px -4px var(--glow); }
}
.tile-glow { animation: tile-glow 3.2s ease-in-out infinite; }
`;

    if (raw) return JSON.parse(raw);
  } catch (e) {

}
async function saveAppState(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

    console.error("Speichern fehlgeschlagen:", e);
  }
}

function wizardRoundCount(playerCount) {
  return Math.floor(60 / playerCount);
}
function wizardRoundScore(bid, tricks) {
  if (bid === null || tricks === null) return null;
  if (bid === tricks) return 20 + 10 * tricks;
  return -10 * Math.abs(bid - tricks);
}
function wizardTotals(players, rounds, uptoRound) {
  const totals = {};

  for (let r = 1; r <= uptoRound; r++) {
    const roundData = rounds[r];
    if (!roundData) continue;
    players.forEach(p => {
      const cell = roundData[p.id];
      if (cell) {
        const score = wizardRoundScore(cell.bid, cell.tricks);
        if (score !== null) totals[p.id] += score;
      }
    });
  }
  return totals;
}

function werewolfAssignRoles(players, enabledRoles, hauptmannOn) {

  while (deck.length < n) deck.push("dorfbewohner");

    // damit der Tausch auch riskant sein kann).
    spares = ["dorfbewohner", Math.random() < 0.5 ? "werwolf" : "dorfbewohner"];
  }
  const shuffled = shuffleArray(deck).slice(0, n);
  const roles = {};
  players.forEach((p, i) => roles[p.id] = shuffled[i]);

    // "Grundkarte", darf aber beim Reveal tauschen.
    const diebPlayer = players[Math.floor(Math.random() * players.length)];
    roles[diebPlayer.id] = {
